version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # eslint-plugin-jsx-a11y supports ESLint 9 at most; ESLint 10 breaks npm ci.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # openapi-typescript and typescript-eslint support TypeScript 5 only.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      testing:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "@playwright/test", "@axe-core/*", "msw", "jsdom"]
      lint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint", "globals"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
