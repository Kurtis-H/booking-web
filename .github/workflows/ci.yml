name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and component tests (80% coverage required)
        run: npm run test:coverage
      - name: Consumer contract (Pact) against a mock of the booking API
        run: npm run test:contract
      - name: The committed contract is up to date
        # api-performance-lab replays pacts/ from main, so it must match the code.
        run: git diff --exit-code -- pacts/
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  pact:
    name: Contract holds against the current API
    # The API replays this app's contract from main on every API change. This
    # job checks the other direction: a change to the contract here is verified
    # against the API before it's merged.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/booking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/api-performance-lab
          path: api
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Generate this branch's contract
        run: npm run test:contract
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e "./api[dev]"
      - name: Verify it against the API's main branch with the API's own provider test
        working-directory: api
        env:
          REQUIRE_PACTS: "1"
        run: |
          mkdir -p consumers/booking-web/pacts
          cp ../pacts/*.json consumers/booking-web/pacts/
          python -m pytest tests/api/test_consumer_contracts.py -v -p no:cacheprovider

  e2e:
    name: End-to-end against the real API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/booking
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Start the booking API (api-performance-lab, every fix on)
        run: |
          pip install "git+https://github.com/Kurtis-H/api-performance-lab"
          python -m app.seed --events 30 --seats 40 --users 60
          RATE_LIMIT_PER_MINUTE=600 nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          cat api.log; exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright (desktop and mobile, with accessibility checks)
        run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            api.log

  contract:
    name: Types match the API's OpenAPI spec
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/booking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Start the booking API
        run: |
          pip install "git+https://github.com/Kurtis-H/api-performance-lab"
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          cat api.log; exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Regenerate types from the live spec
        run: npm run api:types
      - name: Fail if the API changed shape
        run: |
          if ! git diff --exit-code src/api/schema.d.ts; then
            echo "::error::The booking API's spec no longer matches src/api/schema.d.ts. Run npm run api:types, fix any type errors, and commit."
            exit 1
          fi
      - name: The app still type-checks against the spec
        run: npm run typecheck
