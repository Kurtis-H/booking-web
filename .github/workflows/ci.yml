name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and component tests (80% coverage required)
        run: npm run test:coverage
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end against the real API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/booking
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start the booking API (api-performance-lab, every fix on)
        run: |
          pip install "git+https://github.com/Kurtis-H/api-performance-lab"
          python -m app.seed --events 30 --seats 40 --users 60
          RATE_LIMIT_PER_MINUTE=600 nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          cat api.log; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright (desktop and mobile, with accessibility checks)
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            api.log

  contract:
    name: Types match the API's OpenAPI spec
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/booking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start the booking API
        run: |
          pip install "git+https://github.com/Kurtis-H/api-performance-lab"
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          cat api.log; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Regenerate types from the live spec
        run: npm run api:types
      - name: Fail if the API changed shape
        run: |
          if ! git diff --exit-code src/api/schema.d.ts; then
            echo "::error::The booking API's spec no longer matches src/api/schema.d.ts. Run npm run api:types, fix any type errors, and commit."
            exit 1
          fi
      - name: The app still type-checks against the spec
        run: npm run typecheck
